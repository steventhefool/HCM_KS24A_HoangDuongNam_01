<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon lần 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <h1>Hệ thống quản lý công việc</h1>
    </header>
    <main>
        <div class="center">
            <div class="mainContent">
                <h3>Thêm/Cập nhật công việc</h3>
                <form onsubmit="addWork (event)">
                    <div class="container">
                        <div class="inputType1">
                            <div class="inputTypeWorkName">
                                <span>Tên công việc:</span>
                                <br>
                                <input type="text" name="workName" size="50">
                            </div>
                            <div class="inputTypePersonName">
                                <span>Người phụ trách:</span>
                                <br>
                                <input type="text" name="personName" size="50">
                            </div>
                        </div>
                        <div class="inputType2">
                            <div class="inputTypeDate">
                                <span>Hạn chót:</span>
                                <br>
                                <input type="date" name="date">
                            </div>
                            <div class="inputTypeStatus">
                                <span>Trạng thái</span>
                                <br>
                                <input type="text" name="status" size="50">
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-success">Thêm công việc</button>
                </form>
                <input id="search"  type="text" placeholder="Tìm kiếm tên theo công việc..." size="160" style="margin-bottom: 5px;" >
                <br>
                <button onclick="searchWork()">Tìm kiếm</button>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Công việc</th>
                            <th>Hạn chót</th>
                            <th>Phụ trách</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- <tr>
                                <td>123</td>
                                <td>456</td>
                                <td>679</td>
                                <td>11</td>
                                <td>
                                    <button class="btn btn-success">Sửa</button>
                                    <button class="btn btn-danger" style="background-color: red;" onclick="deleteWork (index)">Xóa</button>
                                </td>
                        </tr> -->
                            
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="./main.js"></script>
</body>

</html>
